packages:
  - .

# pnpm 11 reads dependency policy from the workspace file. Keeping these
# security overrides here also remains compatible with the pnpm 10 version
# pinned by packageManager and avoids location-dependent package.json warnings.
overrides:
  brace-expansion: 2.1.4
  minimatch: 9.0.7
  nanoid: 3.3.18
  picomatch: 4.0.4
  postcss: 8.5.23
  rollup: 4.59.0
