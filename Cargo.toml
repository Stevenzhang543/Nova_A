[workspace]
members = [
  "nova_core",
  "crates/nova_math",
  "crates/nova_physics",
  "crates/nova_runtime",
  "crates/nova_script",
  "crates/nova_format",
  "crates/nova_wasm",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "6.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Stevenzhang543/Nova_A"
authors = ["Whitelist"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
rhai = { version = "1.25.0", default-features = false, features = ["std"] }
