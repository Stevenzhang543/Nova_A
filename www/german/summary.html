<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>Session complete — WortWerk</title>
  <link rel="stylesheet" href="/style.css?v=20260909-3">
  <script src="/app.js?v=20260909-3" defer></script>
</head>
<body data-page="summary">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar"><a class="brand" href="/dashboard.html"><span class="brand-mark">W</span>WortWerk</a><button class="icon-button theme-toggle" type="button" aria-label="Change color theme">◐</button></header>
  <main id="main" class="summary-shell shell">
    <section class="summary-card">
      <div class="completion-mark" aria-hidden="true">✓</div>
      <p class="eyebrow">Session complete</p>
      <h1>Gut gemacht.</h1>
      <p id="summary-message" class="summary-message">You strengthened today’s German.</p>
      <div class="xp-result"><span>Focus points</span><strong>+<span id="res-exp">0</span></strong><span id="level-change"></span></div>
      <div class="result-grid">
        <div><span>Accuracy</span><strong id="res-accuracy">0%</strong></div>
        <div><span>Retrievals</span><strong id="res-qs">0</strong></div>
        <div><span>Correct</span><strong id="res-cor">0</strong></div>
        <div><span>Needs work</span><strong id="res-err">0</strong></div>
      </div>
      <div class="summary-actions">
        <a class="button button-primary" href="/dashboard.html">Back to today</a>
        <button id="practice-again" class="button button-quiet" type="button">Another short round</button>
      </div>
    </section>
  </main>
</body>
</html>
