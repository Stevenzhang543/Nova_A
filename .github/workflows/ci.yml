name: Nova_A validation

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native physics process tests
        run: pnpm test:native-headless
      - name: Documentation audit
        run: pnpm audit:manual
      - name: WASM and frontend production build
        run: pnpm build
      - name: TypeScript and build configuration
        run: pnpm check
      - name: Tauri backend check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
