name: Nova_A validation

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Rust tests
        run: cargo test --workspace --all-targets
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: TypeScript
        run: pnpm exec vue-tsc --noEmit
      - name: Documentation audit
        run: pnpm audit:manual
      - name: WASM and frontend production build
        run: pnpm build
      - name: Tauri backend check
        run: cargo check --manifest-path src-tauri/Cargo.toml
